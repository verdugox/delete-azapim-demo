name: destroy-infra

on:
  push:
    branches:
      - develop

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      # =====================================
      # 🔐 AZURE LOGIN
      # =====================================
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =====================================
      # 🔥 PURGE APIM (HARD DELETE)
      # =====================================
      - name: Purge APIM soft-deleted (if exists)
        run: |
          echo "🔍 Checking APIM soft-deleted services..."
          az apim deletedservice purge \
            --service-name apim-cardops-demo \
            --location eastus \
          && echo "✅ APIM soft-delete purged" \
          || echo "ℹ️ No APIM soft-deleted service found"

      # =====================================
      # 🔥 DELETE COSMOS DB (HARD DELETE)
      # =====================================
      - name: Delete Cosmos DB account (if exists)
        run: |
          echo "🔍 Checking Cosmos DB account..."
          if az cosmosdb show \
            --name cosmos-cardops-demo \
            --resource-group rg-cardops-demo >/dev/null 2>&1; then
            echo "🧨 Deleting Cosmos DB account..."
            az cosmosdb delete \
              --name cosmos-cardops-demo \
              --resource-group rg-cardops-demo \
              --yes
            echo "✅ Cosmos DB deleted"
          else
            echo "ℹ️ Cosmos DB account does not exist"
          fi

      # =====================================
      # 💣 DELETE RESOURCE GROUP
      # =====================================
      - name: Destroy Resource Group
        run: |
          echo "🧨 Deleting Resource Group rg-cardops-demo..."
          az group delete \
            --name rg-cardops-demo \
            --yes \
            --no-wait \
          && echo "✅ Resource Group deletion initiated" \
          || echo "ℹ️ Resource Group already deleted"

      # =====================================
      # 🧹 FINAL VALIDATION (REAL CHECK)
      # =====================================
      - name: Final validation (no billable resources)
        run: |
          echo "🔍 Final validation started..."

          RG_EXISTS=$(az group exists --name rg-cardops-demo)

          if [ "$RG_EXISTS" = "false" ]; then
            echo "✅ Resource Group rg-cardops-demo does NOT exist"
            echo "✅ AKS deleted"
            echo "✅ APIM deleted"
            echo "✅ Cosmos DB deleted"
            echo "🎉 ALL RESOURCES DESTROYED SUCCESSFULLY"
            echo "💸 NO BILLABLE RESOURCES REMAIN"
          else
            echo "⚠️ Resource Group rg-cardops-demo STILL EXISTS"
            echo "⚠️ Azure may still be deleting resources"
            echo "⚠️ Re-check in a few minutes"
          fi
